name: Update Fund Prices

on:
  schedule:
    - cron: '0 1 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch prices and write prices.json
        run: |
          python3 - <<'EOF'
          import urllib.request
          import json
          import os
          from datetime import datetime, timezone

          # Read the EXISTING prices.json first and merge into it, instead of
          # overwriting from scratch — otherwise this wipes out the 'energy'
          # key (and anything else, like retirementSettings) written by other
          # workflows, since this one used to run last and clobber everything.
          prices = {}
          if os.path.exists("prices.json"):
            try:
              with open("prices.json") as f:
                prices = json.load(f)
            except Exception as e:
              print(f"Could not read existing prices.json, starting fresh: {e}")

          prices["updated"] = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          prices.setdefault("tsp", {})
          prices.setdefault("fidelity", {})
          prices.setdefault("etf", {})

          try:
            req = urllib.request.Request(
              "https://api.dailytsp.com/close/",
              headers={"User-Agent": "Mozilla/5.0"}
            )
            with urllib.request.urlopen(req, timeout=10) as r:
              data = json.loads(r.read())
            latest = data[max(data.keys())]
            prices["tsp"] = {
              "G": latest.get("G Fund"),
              "F": latest.get("F Fund"),
              "C": latest.get("C Fund"),
              "S": latest.get("S Fund"),
              "I": latest.get("I Fund")
            }
            print(f"TSP prices: {prices['tsp']}")
          except Exception as e:
            print(f"TSP fetch failed: {e}")

          tickers = [
            "VIIIX", "VTPSX", "VEMPX",
            "VTI", "QQQM", "AVUV", "AVDV", "AVES", "VXUS"
          ]

          all_prices = {}
          for ticker in tickers:
            try:
              url = f"https://query1.finance.yahoo.com/v8/finance/chart/{ticker}?interval=1d&range=1d"
              req = urllib.request.Request(
                url,
                headers={
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
                  "Accept": "application/json"
                }
              )
              with urllib.request.urlopen(req, timeout=10) as r:
                data = json.loads(r.read())
              price = data["chart"]["result"][0]["meta"]["regularMarketPrice"]
              all_prices[ticker] = price
              print(f"{ticker}: {price}")
            except Exception as e:
              print(f"{ticker} fetch failed: {e}")

          prices["fidelity"] = {
            "VIIIX": all_prices.get("VIIIX"),
            "VTPSX": all_prices.get("VTPSX"),
            "VEMPX": all_prices.get("VEMPX")
          }

          prices["etf"] = {
            "VTI":  all_prices.get("VTI"),
            "QQQM": all_prices.get("QQQM"),
            "AVUV": all_prices.get("AVUV"),
            "AVDV": all_prices.get("AVDV"),
            "AVES": all_prices.get("AVES"),
            "VXUS": all_prices.get("VXUS")
          }

          with open("prices.json", "w") as f:
            json.dump(prices, f, indent=2)

          print(f"\nprices.json written (all keys preserved):")
          print(json.dumps(prices, indent=2))
          EOF

      - name: Commit prices.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update fund prices $(date -u '+%Y-%m-%d')"
          for i in 1 2 3 4 5; do
            git pull origin main --no-rebase && git push && break
            echo "Push attempt $i failed, retrying in 10s..."
            sleep 10
          done
